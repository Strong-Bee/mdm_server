name: Next.js web build

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/nextjs-web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/nextjs-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build
