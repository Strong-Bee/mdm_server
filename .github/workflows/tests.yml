name: Python and web CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app main.py apns_push.py tests integrations device-helper
      - name: Run MDM backend tests
        run: python -m unittest discover -s tests -v
      - name: Run local iPhone helper tests
        env:
          PYTHONPATH: device-helper
          IPHONE_HELPER_TOKEN: ci-test-token
        run: python -m unittest discover -s device-helper -p "test_*.py" -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Lint frontend
        run: npm run lint
      - name: Build Next.js frontend
        run: npm run build
